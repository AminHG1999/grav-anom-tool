[general]
# Epicenter location (decimal degrees)
# User defined
lat = 38.60
lon = 141.25

# Time bounds (ISO dates). 
#Note: Leave blank to use full available range until the data is available 
start_date = 
end_date   = 

# Maximum spherical harmonic degree/order to load
nmax = 96

# Output/cache directories (relative paths are OK)
out_dir = outputs
cache_dir = icgem_cache

[models]
# Degree for polynomial trend model
polynomial_degree = 1

# Number of sine/cosine pairs for Fourier seasonal model
fourier_terms = 4

# Moving-average window (odd integer)
moving_average_window = 3

[network]
# Networking 
request_timeout = 60
sleep_between_requests = 0.2
max_retries = 3
retry_backoff = 2.0

# Anomaly detection
[model]
wanted_poly_degrees = 1,2
wanted_fourier_terms = 1,2,4
wanted_ma_windows = 3
anomaly_sigma_threshold = 2.0
take_last_anomalies = 3
